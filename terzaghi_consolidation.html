<div class="container">

    <h2>Terzaghi 1D Consolidation Analysis</h2>
    
    <div class="form-row">
        <div class="form-group">
            <label for="coefCv">Coefficient of Consolidation (c<sub>v</sub>)</label>
            <input type="number" id="coefCv" step="any" placeholder="e.g., 1.5 (m²/year)">
        </div>
        <div class="form-group">
            <label for="drainageHdr">Drainage Path Length (H<sub>dr</sub>)</label>
            <input type="number" id="drainageHdr" step="any" placeholder="e.g., 2.0 m">
        </div>
        <div class="form-group">
            <label for="drainageType">Drainage Condition</label>

                <option value="u_from_time">Calculate Consolidation (U%) from Elapsed Time (t)</option>
            </select>
        </div>
        <div class="form-group" id="u-group">
            <label for="targetU">Target Degree of Consolidation (U %)</label>
            <input type="number" id="targetU" step="any" min="0" max="99.99" placeholder="e.g., 90">
        </div>

<div class="standard-actions-bar">

            <span id="calcTv">T<sub>v</sub> = ---</span>

<script>
    let chartInstance = null;

    function updateToggles() {
        document.getElementById('formula-container').classList.toggle('hidden', !document.getElementById('toggleFormula').checked);
    }

    function updateUI() {
        const mode = document.getElementById('calcMode').value;
        const uGroup = document.getElementById('u-group');
        const timeGroup = document.getElementById('time-group');

        if (mode === 'time_from_u') {
            uGroup.classList.remove('hidden');
            timeGroup.classList.add('hidden');
        } else {
            uGroup.classList.add('hidden');
            timeGroup.classList.remove('hidden');
        }
        
        updateFormula();
    }

    function updateFormula() {
        const formula = `$$ T_v = \\frac{c_v \\cdot t}{H_{dr}^2} $$
        <small>where <b>T<sub>v</sub></b> = Time Factor, <b>c<sub>v</sub></b> = Coefficient of Consolidation, <b>t</b> = Time, <b>H<sub>dr</sub></b> = Max Drainage Path</small>`;
        
        const container = document.getElementById('formula-container');
        container.innerHTML = formula;
        
        if (window.MathJax) {
            MathJax.typesetPromise([container]).catch(function (err) {
                console.error('MathJax typeset failed:', err);
            });
        }
    }

    // Core Equations
    function tvFromU(uPercent) {
        if (uPercent <= 60.0) {
            return (Math.PI / 4.0) * Math.pow(uPercent / 100.0, 2);
        } else {
            return 1.781 - 0.933 * Math.log10(100.0 - uPercent);
        }
    }

    function uFromTv(tv) {
        if (tv <= 0.2827) {
            return 100.0 * Math.sqrt((4.0 * tv) / Math.PI);
        } else {
            return 100.0 - Math.pow(10.0, (1.781 - tv) / 0.933);
        }
    }

    function calculateIsochronePoints(tv, drainage, zSteps = 100, mTerms = 100) {
        let points = [];
        const zMax = drainage === 'single' ? 1.0 : 2.0;
        const dz = zMax / zSteps;
        for (let i = 0; i <= zSteps; i++) {
            let zNorm = i * dz;
            let uRatio = 0;
            for (let m = 0; m < mTerms; m++) {
                let M = (Math.PI / 2.0) * (2 * m + 1);
                let term = (2.0 / M) * Math.sin(M * zNorm) * Math.exp(-Math.pow(M, 2) * tv);
                uRatio += term;
            }
            points.push({ x: uRatio, y: zNorm });
        }
        return points;
    }

    function calculateAndPlot() {
        const cv = parseFloat(document.getElementById('coefCv').value);
        const hdr = parseFloat(document.getElementById('drainageHdr').value);
        const mode = document.getElementById('calcMode').value;
        
        const resultBox = document.getElementById('resultBox');
        const chartBox = document.getElementById('chartContainer');
        
        resultBox.classList.remove('hidden');

        document.querySelectorAll('.input-error').forEach(el => el.classList.remove('input-error'));
        
        const reqIds = ['coefCv', 'drainageHdr'];
        if (mode === 'time_from_u') reqIds.push('targetU');
        else reqIds.push('elapsedTime');
        reqIds.forEach(id => {
            const el = document.getElementById(id);
            if (el && el.value.trim() === '') {
                el.classList.add('input-error');
            }
        });

        if (isNaN(cv) || isNaN(hdr) || cv <= 0 || hdr <= 0) {
            document.getElementById('resultValue').innerText = "---";
            document.getElementById('resultLabel').innerText = "Invalid inputs for cv or Hdr";
            document.getElementById('calcTv').innerText = `Tv = ---`;
            chartBox.classList.add('hidden');
            return;
        }

        let tv = 0;
        let resultText = "";
        let labelText = "";

        if (mode === 'time_from_u') {
            const u = parseFloat(document.getElementById('targetU').value);
            if (isNaN(u) || u < 0 || u >= 100) {
                document.getElementById('resultValue').innerText = "---";
                document.getElementById('resultLabel').innerText = "Invalid U% (Must be 0-99.99)";
                return;
            }
            tv = tvFromU(u);
            const t = (tv * Math.pow(hdr, 2)) / cv;
            labelText = `Required Time (t) to reach ${u}%`;
            resultText = t.toFixed(4) + " (time units)";
        } else {
            const t = parseFloat(document.getElementById('elapsedTime').value);
            if (isNaN(t) || t < 0) {
                document.getElementById('resultValue').innerText = "---";
                document.getElementById('resultLabel').innerText = "Invalid Elapsed Time";
                return;
            }
            tv = (cv * t) / Math.pow(hdr, 2);
            const u = uFromTv(tv);
            labelText = `Degree of Consolidation (U%) at t=${t}`;
            resultText = u.toFixed(2) + " %";
        }

        document.getElementById('resultLabel').innerText = labelText;
        document.getElementById('resultValue').innerText = resultText;
        document.getElementById('calcTv').innerText = `Tv = ${tv.toFixed(4)}`;
        
        plotIsochrones(tv);
    }

    function plotIsochrones(targetTv) {
        document.getElementById('chartContainer').classList.remove('hidden');
        const ctx = document.getElementById('isochroneChart').getContext('2d');
        const drainage = document.getElementById('drainageType').value;
        const zMax = drainage === 'single' ? 1.0 : 2.0;

        if (chartInstance) {
            chartInstance.destroy();
        }

        const standardTvs = [0.05, 0.1, 0.2, 0.4, 0.8];
        const lineColors = ['#ff7f0e', '#2ca02c', '#9467bd', '#8c564b', '#e377c2'];
        const lineDashes = [[4, 4], [8, 4], [12, 4], [16, 4], [20, 4]];
        let datasets = [];

        // Add standard reference lines
        standardTvs.forEach((tv, idx) => {
            datasets.push({
                label: `Tv = ${tv}`,
                data: calculateIsochronePoints(tv, drainage),
                borderColor: lineColors[idx],
                borderWidth: 2,
                borderDash: lineDashes[idx],
                showLine: true,
                pointRadius: 0,
                fill: false
            });
        });

        // Add the calculated target Tv line prominently
        datasets.push({
            label: `Target Tv = ${targetTv.toFixed(3)}`,
            data: calculateIsochronePoints(targetTv, drainage),
            borderColor: '#0066cc',
            borderWidth: 3,
            showLine: true,
            pointRadius: 0,
            fill: false
        });

        chartInstance = new Chart(ctx, {
            type: 'scatter',
            data: { datasets: datasets },
            options: {
                responsive: true,
                scales: {
                    x: { title: { display: true, text: 'Excess Pore Pressure Ratio (u_e / u_0)' }, min: 0, max: 1.05 },
                    y: { title: { display: true, text: 'Normalized Depth (z / H_dr)' }, reverse: true, min: 0, max: zMax }
                },
                plugins: { legend: { position: 'right' } }
            }
        });
    }

    // Initialize
    updateToggles();
    updateUI();

    document.addEventListener('input', function(e) {
        if (e.target.classList && e.target.classList.contains('input-error')) {
            e.target.classList.remove('input-error');
        }
    });

    function loadDemoData() {
        
        document.getElementById('coefCv').value = '3.5';

        document.getElementById('targetU').value = '50';
        calculateAndPlot();
        
    }
    function clearToolData() {
        
        document.querySelectorAll('input[type=number]').forEach(i => i.value = '');
