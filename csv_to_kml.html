    </div>
    <h1>📍 CSV to KML Converter</h1>
    <p>Select a <strong>.csv</strong> file below. It will be processed <strong>locally in your browser</strong> to generate a KML file.</p>
    
    <div class="upload-area">
        <input type="file" id="fileInput" accept=".csv" style="font-size: 16px;">
    </div>

    <div class="form-group">
        <label for="latCol">Latitude Column Name</label>
        <input type="text" id="latCol" value="latitude">
    </div>
    <div class="form-group">
        <label for="lonCol">Longitude Column Name</label>
        <input type="text" id="lonCol" value="longitude">
    </div>
    <div class="form-group">
        <label for="nameCol">Placemark Name Column</label>
        <input type="text" id="nameCol" value="name">
    </div>
    <div class="form-group">
        <label for="altCol">Altitude Column Name (Optional)</label>

    </div>

</div>

<script>
    const fileInput = document.getElementById('fileInput');
    const latColInput = document.getElementById('latCol');
    const lonColInput = document.getElementById('lonCol');
    const nameColInput = document.getElementById('nameCol');
    const altColInput = document.getElementById('altCol');
    const processBtn = document.getElementById('processBtn');
    const logDiv = document.getElementById('log');
    const progressText = document.getElementById('progressText');

    function log(message) {
        const p = document.createElement('div');
        p.textContent = message;
        logDiv.appendChild(p);
        logDiv.scrollTop = logDiv.scrollHeight;
    }

    // Simple CSV parser that handles basic quotes
    function parseCSV(text) {
        const lines = text.split(/\r?\n/);
        const result = [];
        for (let line of lines) {
            if (!line.trim()) continue;
            const rowArr = [];
            let inQuotes = false;
            let currentVal = '';
            for (let i = 0; i < line.length; i++) {
                let char = line[i];
                if (char === '"') {
                    inQuotes = !inQuotes;
                } else if (char === ',' && !inQuotes) {
                    rowArr.push(currentVal);
                    currentVal = '';
                } else {
                    currentVal += char;
                }
            }
            rowArr.push(currentVal);
            result.push(rowArr.map(v => v.replace(/^"|"$/g, '').trim()));
        }
        return result;
    }

    processBtn.addEventListener('click', async () => {
        const files = fileInput.files;
        if (files.length === 0) {
            alert("Please select a CSV file first!");
            return;
        }

        const file = files[0];
        const latColName = latColInput.value.trim();
        const lonColName = lonColInput.value.trim();
        const nameColName = nameColInput.value.trim();
        const altColName = altColInput.value.trim();

        if (!latColName || !lonColName || !nameColName) {
            alert("Please provide the column names for Latitude, Longitude, and Name.");
            return;
        }

        processBtn.disabled = true;
        logDiv.innerHTML = '';
        progressText.textContent = "Reading file...";

        try {
            log(`Reading CSV file: ${file.name}`);
            const text = await file.text();
            
            log("Parsing CSV data...");
            const rows = parseCSV(text);
            
            if (rows.length < 2) {
                throw new Error("CSV file must contain a header row and at least one data row.");
            }

            const headers = rows[0];
            const latIdx = headers.indexOf(latColName);
            const lonIdx = headers.indexOf(lonColName);
            const nameIdx = headers.indexOf(nameColName);

            if (latIdx === -1 || lonIdx === -1) {
                throw new Error(`Could not find coordinate columns '${latColName}' or '${lonColName}'. Available columns: ${headers.join(', ')}`);
            }

            const altIdx = altColName ? headers.indexOf(altColName) : -1;
            if (altColName && altIdx === -1) {
                log(`[Warning] Altitude column '${altColName}' not found. Defaulting to 0.`);
            }

            let placemarks = '';
            let validPoints = 0;

            for (let i = 1; i < rows.length; i++) {
                const row = rows[i];
                
                // Skip malformed rows
                if (row.length <= Math.max(latIdx, lonIdx)) continue;

                const latStr = row[latIdx];
                const lonStr = row[lonIdx];
                const nameStr = nameIdx !== -1 && row.length > nameIdx ? row[nameIdx] : `Point ${i}`;
                const altStr = altIdx !== -1 && row.length > altIdx ? row[altIdx] : "0";

                const lat = parseFloat(latStr);
                const lon = parseFloat(lonStr);
                let alt = parseFloat(altStr);
                
                if (isNaN(alt)) alt = 0.0;

                if (!isNaN(lat) && !isNaN(lon)) {
                    placemarks += `
      <Placemark>
        <name><![CDATA[${nameStr}]]></name>
        <Point>
          <coordinates>${lon},${lat},${alt}</coordinates>
        </Point>
      </Placemark>`;
                    validPoints++;
                } else {
                    log(`[Warning] Skipping row ${i + 1} due to invalid coordinates: ${latStr}, ${lonStr}`);
                }
            }

            if (validPoints === 0) {
                throw new Error("No valid coordinates found in the CSV to create KML.");
            }

            log(`Successfully parsed ${validPoints} point(s). Generating KML...`);
            
            const kmlHeader = `<?xml version="1.0" encoding="UTF-8"?>\n<kml xmlns="http://www.opengis.net/kml/2.2">\n  <Document>\n    <name>Exported Points</name>\n`;
            const kmlFooter = `  </Document>\n</kml>`;
            const kmlContent = kmlHeader + placemarks + "\n" + kmlFooter;

            progressText.textContent = "Downloading KML...";

            const blob = new Blob([kmlContent], { type: 'application/vnd.google-earth.kml+xml;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            
            let outName = file.name.replace(/\.[^/.]+$/, "") + "_converted.kml";
            link.download = outName;
            
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            log("✅ KML generated and downloaded successfully!");
            progressText.textContent = "Done!";

        } catch (error) {
            log(`[Error] ${error.message}`);
            progressText.textContent = "An error occurred.";
        }

        processBtn.disabled = false;
    });

        if (fi) fi.value = '';
        
    }
    
</script>
