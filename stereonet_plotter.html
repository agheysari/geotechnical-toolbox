<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Interactive kinematic stereonet plotter for rock mechanics structural data (dip, dip direction).">
<title>Stereonet Plotter | Geotechnical Tools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
    :root {
      --primary: #0284c7;
      --primary-dark: #0369a1;
      --primary-light: #e0f2fe;
      --surface: #ffffff;
      --background: #f8fafc;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --danger: #dc2626;
      --radius: 10px;
      --font: 'Inter', system-ui, sans-serif;
    }
    body {
      margin: 0; padding: 28px 16px 8px;
      background: var(--background); color: var(--text);
      font-family: var(--font); font-size: 14px; line-height: 1.6;
    }
    .container { max-width: 1100px; margin: 0 auto; }
    .tool-header { margin-bottom: 20px; }
    .tool-header h1 { margin: 0; font-size: 25px; font-weight: 800; letter-spacing: -0.015em; }
    .tool-header .subtitle { margin: 8px 0 0; color: var(--text-muted); }
    .tool-header .back-link { display: inline-block; margin-bottom: 10px; font-size: 12px; font-weight: 600; color: var(--text-muted); text-decoration: none; }
    .tool-header .back-link:hover { color: var(--primary); }
    
    .layout-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: start; }
    @media (max-width: 900px) { .layout-grid { grid-template-columns: 1fr; } }
    
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; }
    .card-title { font-weight: 700; padding-bottom: 8px; border-bottom: 1px solid var(--border); margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center;}
    
    table { width: 100%; border-collapse: collapse; margin-bottom: 16px; text-align: left; }
    th { font-size: 12px; font-weight: 700; color: var(--text-muted); padding: 8px; border-bottom: 2px solid var(--border); }
    td { padding: 8px; border-bottom: 1px solid var(--border); }
    input[type=number], input[type=text] { width: 100%; padding: 6px; border: 1px solid var(--border); border-radius: 4px; font-size: 13px; }
    input[type=color] { border: none; width: 30px; height: 30px; cursor: pointer; background: none; padding: 0;}
    input:focus { outline: none; border-color: var(--primary); }
    
    .btn { padding: 6px 12px; border-radius: 6px; border: none; cursor: pointer; font-weight: 600; background: var(--primary-light); color: var(--primary-dark); }
    .btn:hover { background: #bae6fd; }
    .btn-danger { background: #fef2f2; color: var(--danger); padding: 4px 8px; }
    
    .plot-container { width: 100%; aspect-ratio: 1; position: relative; background: white; border-radius: 8px; border: 1px solid var(--border); overflow: hidden; display: flex; justify-content: center; align-items: center;}
    .controls { margin-bottom: 16px; display: flex; gap: 12px; align-items: center;}
</style>
</head>
<body>

<div class="container">
    <div class="tool-header">
        <a href="index.html" class="back-link">← Back to Tools</a>
        <h1>Stereonet Plotter</h1>
        <p class="subtitle">Kinematic stereonet plotting of planar features (dip, dip direction) and their poles using equal-area (Schmidt) or equal-angle (Wulff) lower hemisphere projections.</p>
    </div>

    <div class="layout-grid">
        <div class="card">
            <div class="card-title">
                <span>Input Planes (Dip / Dip Direction)</span>
                <button class="btn" onclick="addPlane()">+ Add Plane</button>
            </div>
            
            <div class="controls">
                <label><strong>Projection:</strong>
                    <select id="projType" onchange="drawStereonet()" style="padding:4px;">
                        <option value="equal-area">Equal-Area (Schmidt)</option>
                        <option value="equal-angle">Equal-Angle (Wulff)</option>
                    </select>
                </label>
            </div>

            <table id="planesTable">
                <thead>
                    <tr>
                        <th>Dip (°)</th>
                        <th>Dip Dir (°)</th>
                        <th>Color</th>
                        <th>Pole</th>
                        <th>Plane</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="planesBody">
                </tbody>
            </table>
        </div>

        <div class="card">
            <div class="card-title">Stereonet Projection</div>
            <div class="plot-container" id="svgWrapper">
                <!-- SVG injected here -->
            </div>
            <div style="margin-top: 16px; text-align: center;">
                <button class="btn" onclick="downloadPNG()">Download PNG</button>
            </div>
        </div>
    </div>
</div>

<script>
    const D2R = Math.PI / 180;
    const R2D = 180 / Math.PI;

    let planes = [
        { dip: 45, dipDir: 90, color: '#ef4444', showPole: true, showPlane: true },
        { dip: 60, dipDir: 210, color: '#3b82f6', showPole: true, showPlane: true },
        { dip: 30, dipDir: 330, color: '#10b981', showPole: true, showPlane: true }
    ];

    function projectVector(plunge, trend, projType) {
        const pRad = plunge * D2R;
        const tRad = trend * D2R;
        let R = 0;
        if (projType === 'equal-area') {
            R = Math.sqrt(2) * Math.sin((Math.PI / 2 - pRad) / 2);
        } else {
            R = Math.tan((Math.PI / 2 - pRad) / 2);
        }
        return { x: R * Math.sin(tRad), y: R * Math.cos(tRad) };
    }

    function getPole(dip, dipDir) {
        return {
            plunge: 90 - dip,
            trend: (dipDir + 180) % 360
        };
    }

    function generateGreatCircle(dip, dipDir, projType) {
        const pts = [];
        const strike = (dipDir - 90) * D2R;
        const dDir = dipDir * D2R;
        const dRad = dip * D2R;

        const Sx = Math.cos(strike), Sy = Math.sin(strike), Sz = 0;
        const Dx = Math.cos(dDir) * Math.cos(dRad), Dy = Math.sin(dDir) * Math.cos(dRad), Dz = Math.sin(dRad);

        for (let i = 0; i <= 90; i++) {
            const t = (i / 90) * Math.PI;
            const vx = Sx * Math.cos(t) + Dx * Math.sin(t);
            const vy = Sy * Math.cos(t) + Dy * Math.sin(t);
            const vz = Sz * Math.cos(t) + Dz * Math.sin(t);

            const plunge = Math.asin(vz) * R2D;
            let trend = Math.atan2(vy, vx) * R2D;
            if (trend < 0) trend += 360;

            pts.push(projectVector(plunge, trend, projType));
        }
        return pts;
    }

    function generateGrid(projType) {
        const lines = [];
        for (let dip = 10; dip < 90; dip += 10) {
            lines.push(generateGreatCircle(dip, 90, projType));
            lines.push(generateGreatCircle(dip, 270, projType));
        }
        lines.push(generateGreatCircle(90, 90, projType));

        for (let lat = 10; lat < 90; lat += 10) {
            const latRad = lat * D2R;
            const cN = [], cS = [];
            for (let i = 0; i <= 90; i++) {
                const t = (i / 90) * Math.PI;
                const x = Math.cos(latRad);
                const y = Math.sin(latRad) * Math.cos(t);
                const z = Math.sin(latRad) * Math.sin(t);
                const plunge = Math.asin(z) * R2D;
                
                let tN = Math.atan2(y, x) * R2D; if(tN<0) tN+=360;
                let tS = Math.atan2(y, -x) * R2D; if(tS<0) tS+=360;
                cN.push(projectVector(plunge, tN, projType));
                cS.push(projectVector(plunge, tS, projType));
            }
            lines.push(cN, cS);
        }
        const eq = [];
        for(let i=0;i<=90;i++){
            const t=(i/90)*Math.PI;
            const y=Math.cos(t), z=Math.sin(t);
            const plunge = Math.asin(z)*R2D;
            let trend = Math.atan2(y,0)*R2D; if(trend<0) trend+=360;
            eq.push(projectVector(plunge, trend, projType));
        }
        lines.push(eq);
        return lines;
    }

    function drawStereonet() {
        const wrapper = document.getElementById('svgWrapper');
        const projType = document.getElementById('projType').value;
        const R = 200;
        const pad = 30;
        const size = R*2 + pad*2;
        const cx = size/2, cy = size/2;

        let svg = `<svg id="stereonetSvg" width="100%" height="100%" viewBox="0 0 ${size} ${size}" style="background:white; font-family:sans-serif;">`;
        svg += `<circle cx="${cx}" cy="${cy}" r="${R}" fill="white" stroke="#333" stroke-width="1.5" />`;

        const grid = generateGrid(projType);
        grid.forEach(line => {
            let d = "";
            line.forEach((p, i) => {
                const px = cx + p.x * R;
                const py = cy - p.y * R;
                d += (i===0?"M":"L") + px + "," + py;
            });
            svg += `<path d="${d}" fill="none" stroke="#e2e8f0" stroke-width="1" />`;
        });

        const labels = [{t:'N', x:0, y:-1},{t:'E', x:1, y:0},{t:'S', x:0, y:1},{t:'W', x:-1, y:0}];
        labels.forEach(lb => {
            svg += `<text x="${cx + lb.x*(R+15)}" y="${cy + lb.y*(R+15)}" fill="#333" font-size="14" font-weight="bold" text-anchor="middle" dominant-baseline="central">${lb.t}</text>`;
        });

        planes.forEach(pl => {
            if (pl.showPlane) {
                const gc = generateGreatCircle(pl.dip, pl.dipDir, projType);
                let d = "";
                gc.forEach((p, i) => {
                    d += (i===0?"M":"L") + (cx + p.x*R) + "," + (cy - p.y*R);
                });
                svg += `<path d="${d}" fill="none" stroke="${pl.color}" stroke-width="2" />`;
            }
            if (pl.showPole) {
                const pole = getPole(pl.dip, pl.dipDir);
                const pp = projectVector(pole.plunge, pole.trend, projType);
                svg += `<circle cx="${cx + pp.x*R}" cy="${cy - pp.y*R}" r="4" fill="${pl.color}" />`;
            }
        });

        svg += `</svg>`;
        wrapper.innerHTML = svg;
    }

    function renderTable() {
        const tbody = document.getElementById('planesBody');
        tbody.innerHTML = '';
        planes.forEach((pl, i) => {
            tbody.innerHTML += `
                <tr>
                    <td><input type="number" value="${pl.dip}" onchange="update(${i}, 'dip', this.value)"></td>
                    <td><input type="number" value="${pl.dipDir}" onchange="update(${i}, 'dipDir', this.value)"></td>
                    <td><input type="color" value="${pl.color}" onchange="update(${i}, 'color', this.value)"></td>
                    <td><input type="checkbox" ${pl.showPole?'checked':''} onchange="update(${i}, 'showPole', this.checked)"></td>
                    <td><input type="checkbox" ${pl.showPlane?'checked':''} onchange="update(${i}, 'showPlane', this.checked)"></td>
                    <td><button class="btn-danger" onclick="removePlane(${i})">✕</button></td>
                </tr>
            `;
        });
        drawStereonet();
    }

    function addPlane() {
        planes.push({ dip: 45, dipDir: 0, color: '#333333', showPole: true, showPlane: true });
        renderTable();
    }

    function removePlane(i) {
        planes.splice(i, 1);
        renderTable();
    }

    function update(i, field, val) {
        planes[i][field] = (field==='dip'||field==='dipDir') ? parseFloat(val)||0 : val;
        drawStereonet();
    }

    function downloadPNG() {
        const svgElement = document.getElementById('stereonetSvg');
        const canvas = document.createElement('canvas');
        canvas.width = 1000;
        canvas.height = 1000;
        const ctx = canvas.getContext('2d');
        const data = new XMLSerializer().serializeToString(svgElement);
        const win = window.URL || window.webkitURL || window;
        const img = new Image();
        const blob = new Blob([data], { type: 'image/svg+xml' });
        const url = win.createObjectURL(blob);
        img.onload = function() {
            ctx.fillStyle = 'white';
            ctx.fillRect(0,0,1000,1000);
            ctx.drawImage(img, 0, 0, 1000, 1000);
            win.revokeObjectURL(url);
            const a = document.createElement('a');
            a.download = 'stereonet_plot.png';
            a.href = canvas.toDataURL('image/png');
            a.click();
        };
        img.src = url;
    }

    window.onload = renderTable;
</script>
</body>
</html>
