<body>

<div id="universal-converter-tool" class="container">
    <div class="legacy-top-bar">
      <div></div>
      <div class="legacy-actions">
        
      </div>
    </div>
    <h1>🔄 Universal Spatial Converter</h1>
    <p>Convert and filter mapping data seamlessly entirely within your browser.</p>

    <div class="upload-area">
        <input type="file" id="fileInput" accept=".geojson,.json,.kml,.kmz,.gpx" style="font-size: 16px;">
        <p style="margin-top: 0.5rem; color: #666;"><small><em>Supports GeoJSON, KML, KMZ, and GPX</em></small></p>
    </div>

    <div class="grid-options">
        <fieldset>
            <legend>Filter Geometry</legend>
            <label><input type="checkbox" id="chkPoints" checked> 📍 Include Points (Waypoints)</label>
            <label><input type="checkbox" id="chkLines" checked> 📈 Include Lines (Tracks/Paths)</label>
            <label><input type="checkbox" id="chkPolygons" checked> 🔲 Include Polygons</label>
        </fieldset>

        <fieldset>
            <legend>Output Format</legend>
            <label><input type="radio" name="outFormat" value="geojson" checked> GeoJSON (.geojson)</label>
            <label><input type="radio" name="outFormat" value="kml"> KML (.kml)</label>
            <label><input type="radio" name="outFormat" value="kmz"> KMZ (Zipped KML)</label>
            <label><input type="radio" name="outFormat" value="gpx"> GPX (.gpx)</label>
            <label><input type="radio" name="outFormat" value="csv"> CSV (.csv)</label>
        </fieldset>
    </div>

    
    <div class="standard-actions-bar">
      <button type="button" class="btn-primary-action" onclick="document.getElementById('processBtn') ? document.getElementById('processBtn').click() : null">
        <span>⚡ Convert & Process Format</span>
      </button>
      <button type="button" class="btn-demo-action" onclick="loadDemoData()">
        <span>📋 Load Demo Data</span>
      </button>
      <button type="button" class="btn-clear-action" onclick="clearToolData()">
        <span>🗑️ Clear</span>
      </button>
    </div>
    <div class="coffee-link-under-calc">
      <a href="https://buymeacoffee.com/agheysari" target="_blank" rel="noopener noreferrer">
        <span>☕ Enjoying this free tool? <u>Buy me a coffee</u></span>
      </a>
    </div>
    



    <div id="log">Waiting for files...</div>
</div>

<script>
    const fileInput = document.getElementById('fileInput');
    const processBtn = document.getElementById('processBtn');
    const logDiv = document.getElementById('log');
    let uploadedGeoJSON = null;
    let originalName = "export";
    const chkPoints = document.getElementById('chkPoints');
    const chkLines = document.getElementById('chkLines');
    const chkPolygons = document.getElementById('chkPolygons');

    function log(msg) {
        logDiv.innerHTML += `<div>${msg}</div>`;
        logDiv.scrollTop = logDiv.scrollHeight;
    }

    function escapeXML(str) {
        if (str === null || str === undefined) return '';
        return String(str).replace(/&/g, '&amp;')
                          .replace(/</g, '&lt;')
                          .replace(/>/g, '&gt;')
                          .replace(/"/g, '&quot;')
                          .replace(/'/g, '&apos;');
    }

    function buildKML(features, title) {
        let kml = `<?xml version="1.0" encoding="UTF-8"?>\n<kml xmlns="http://www.opengis.net/kml/2.2">\n<Document>\n  <name>${escapeXML(title)}</name>\n`;
        for (const feature of features) {
            const name = escapeXML(feature.properties?.name || 'Feature');
            const geom = feature.geometry;
            if (!geom || !geom.coordinates) continue;
            
            kml += `  <Placemark>\n    <name>${name}</name>\n`;
            if (geom.type === 'Point') {
                kml += `    <Point><coordinates>${geom.coordinates.join(',')}</coordinates></Point>\n`;
            } else if (geom.type === 'LineString') {
                const coords = geom.coordinates.map(c => c.join(',')).join(' ');
                kml += `    <LineString><coordinates>${coords}</coordinates></LineString>\n`;
            } else if (geom.type === 'Polygon') {
                const coords = geom.coordinates[0].map(c => c.join(',')).join(' ');
                kml += `    <Polygon><outerBoundaryIs><LinearRing><coordinates>${coords}</coordinates></LinearRing></outerBoundaryIs></Polygon>\n`;
            }
            kml += `  </Placemark>\n`;
        }
        return kml + `</Document>\n</kml>`;
    }

    function buildGPX(features) {
        let gpx = `<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="UniversalConverter" xmlns="http://www.topografix.com/GPX/1/1">\n`;
        let discarded = 0;
        for (const feature of features) {
            const name = escapeXML(feature.properties?.name || 'Feature');
            const geom = feature.geometry;
            if (!geom || !geom.coordinates) continue;

            if (geom.type === 'Point') {
                const eleTag = geom.coordinates.length > 2 ? `<ele>${geom.coordinates[2]}</ele>` : '';
                gpx += `  <wpt lat="${geom.coordinates[1]}" lon="${geom.coordinates[0]}"><name>${name}</name>${eleTag}</wpt>\n`;
            } else if (geom.type === 'LineString') {
                gpx += `  <trk>\n    <name>${name}</name>\n    <trkseg>\n`;
                for (const c of geom.coordinates) {
                    const eleTag = c.length > 2 ? `<ele>${c[2]}</ele>` : '';
                    gpx += `      <trkpt lat="${c[1]}" lon="${c[0]}">${eleTag}</trkpt>\n`;
                }
                gpx += `    </trkseg>\n  </trk>\n`;
            } else if (geom.type === 'Polygon') {
                discarded++;
            }
        }
        if (discarded > 0) log(`[Warning] Discarded ${discarded} Polygon(s) as GPX lacks standard support.`);
        return gpx + `</gpx>`;
    }

    function buildCSV(features) {
        let csv = "name,latitude,longitude,geometry_wkt\n";
        for (const feature of features) {
            const geom = feature.geometry;
            if (!geom || !geom.type) continue;
            const name = feature.properties?.name || 'Feature';
            const safeName = `"${String(name).replace(/"/g, '""')}"`;
            let lat = '';
            let lon = '';
            let wkt = '';
            if (geom.type === 'Point') {
                lon = geom.coordinates[0];
                lat = geom.coordinates[1];
                wkt = `POINT(${lon} ${lat})`;
            } else if (geom.type === 'LineString') {
                const pts = geom.coordinates.map(c => `${c[0]} ${c[1]}`).join(', ');
                wkt = `LINESTRING(${pts})`;
            } else if (geom.type === 'Polygon') {
                const rings = geom.coordinates.map(ring => {
                    return '(' + ring.map(c => `${c[0]} ${c[1]}`).join(', ') + ')';
                }).join(', ');
                wkt = `POLYGON(${rings})`;
            }
            csv += `${safeName},${lat},${lon},"${wkt}"\n`;
        }
        return csv;
    }

    fileInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        
        uploadedGeoJSON = null;
        originalName = file.name.replace(/\.[^/.]+$/, "");
        const ext = file.name.toLowerCase().split('.').pop();
        
        log(`Loading ${file.name}...`);
        try {
            if (ext === 'kmz') {
                const zip = await JSZip.loadAsync(file);
                const kmlFiles = Object.keys(zip.files).filter(name => name.toLowerCase().endsWith('.kml'));
                if (kmlFiles.length === 0) throw new Error("No KML file inside KMZ.");
                const kmlText = await zip.files[kmlFiles[0]].async("text");
                uploadedGeoJSON = toGeoJSON.kml(new DOMParser().parseFromString(kmlText, "text/xml"));
            } else if (ext === 'kml') {
                const text = await file.text();
                uploadedGeoJSON = toGeoJSON.kml(new DOMParser().parseFromString(text, "text/xml"));
            } else if (ext === 'gpx') {
                const text = await file.text();
                uploadedGeoJSON = toGeoJSON.gpx(new DOMParser().parseFromString(text, "text/xml"));
            } else {
                const text = await file.text();
                uploadedGeoJSON = JSON.parse(text);
            }
            
            if (!uploadedGeoJSON || !uploadedGeoJSON.features) {
                throw new Error("Failed to parse valid features.");
            }
            log(`✅ Successfully loaded ${uploadedGeoJSON.features.length} features.`);
        } catch (err) {
            log(`❌ Error loading file: ${err.message}`);
        }
    });

    processBtn.addEventListener('click', async () => {
        if (!uploadedGeoJSON) {
            alert("Please upload a valid file first.");
            return;
        }
        processBtn.disabled = true;
        
        try {
            const allowedTypes = [];
            if (document.getElementById('chkPoints').checked) allowedTypes.push('Point');
            if (document.getElementById('chkLines').checked) allowedTypes.push('LineString');
            if (document.getElementById('chkPolygons').checked) allowedTypes.push('Polygon');

            log(`Filtering geometries (${allowedTypes.join(', ')})...`);
            const filteredFeatures = uploadedGeoJSON.features.filter(f => 
                f.geometry && allowedTypes.includes(f.geometry.type)
            );
            
            log(`Kept ${filteredFeatures.length} out of ${uploadedGeoJSON.features.length} features.`);

            if (filteredFeatures.length === 0) {
                log("❌ Nothing to export after filtering.");
                processBtn.disabled = false;
                return;
            }

            const format = document.querySelector('input[name="outFormat"]:checked').value;
            const outName = `${originalName}_converted.${format}`;
            
            log(`Generating ${format.toUpperCase()} export...`);
            
            let blob;
            if (format === 'geojson') {
                const data = JSON.stringify({ type: "FeatureCollection", features: filteredFeatures }, null, 2);
                blob = new Blob([data], { type: 'application/geo+json' });
            } else if (format === 'kml') {
                const data = buildKML(filteredFeatures, outName);
                blob = new Blob([data], { type: 'application/vnd.google-earth.kml+xml' });
            } else if (format === 'gpx') {
                const data = buildGPX(filteredFeatures);
                blob = new Blob([data], { type: 'application/gpx+xml' });
            } else if (format === 'csv') {
                const data = buildCSV(filteredFeatures);
                blob = new Blob([data], { type: 'text/csv;charset=utf-8;' });
            } else if (format === 'kmz') {
                const kmlString = buildKML(filteredFeatures, 'doc.kml');
                const zip = new JSZip();
                zip.file("doc.kml", kmlString);
                blob = await zip.generateAsync({ type: "blob", compression: "DEFLATE" });
            }

            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = outName;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            log("✅ Download triggered successfully!");
        } catch (err) {
            log(`❌ Export error: ${err.message}`);
        }
        
        processBtn.disabled = false;
    });


    
    


    // ── Standard Demo & Clear Helpers ─────────────────────────────────
    function loadDemoData() {
        
        alert('Please choose or drag a GIS file (GeoJSON, KML, GPX, CSV).');
        
    }
    function clearToolData() {
        
        const fi = document.getElementById('fileInput');
        if (fi) fi.value = '';
        
    }
    
</script>
